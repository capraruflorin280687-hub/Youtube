              s = s.replaceAllMapped(
                RegExp(r'(\d+) (second|minute|hour|day|week|month|year)s? ago'),
                (m) => _roAgo(int.parse(m[1]!), m[2]!),
              );
              s = s.replaceAllMapped(
                RegExp(r'\b(\d[\d.,]*[KMB]?) views?\b'),
                (m) => '${m[1]} ${m[1] == '1' ? 'vizionare' : 'vizionări'}',
              );
              s = s.replaceAllMapped(RegExp(r'\b(\d[\d.,]*[KMB]?) watching\b'), (m) => '${m[1]} urmăresc acum');
              return s
                  .replaceAll('Streamed ', 'Transmis ')
                  .replaceAll('Premiered ', 'Premieră ')
                  .replaceAll('Scheduled for ', 'Programat pentru ');
            }
          }

          String _roAgo(int n, String unit) {
            const one = {
              'second': 'o secundă',
              'minute': 'un minut',
              'hour': 'o oră',
              'day': 'o zi',
              'week': 'o săptămână',
