          p = 'android/app/src/main/kotlin/com/youpipe/app/PlaybackProxy.kt'
          patch(p, "import java.util.UUID\n",
                   "import java.util.UUID\nimport java.util.concurrent.Callable\nimport java.util.concurrent.ExecutionException\n")
          patch(p, "    private fun serve(client: Socket) =\n",
                   "    // Fetches the next chunk while the current one is passed to the player (about twice the download speed).\n"
                   "    private val prefetchPool = Executors.newCachedThreadPool { r -> Thread(r).apply { isDaemon = true } }\n\n"
                   "    private fun serve(client: Socket) =\n")
          patch(p,
          """            var offset = start
                      while (true) {
                          out.write(chunk)
                          offset += chunk.size
                          if (offset > end || chunk.isEmpty()) break
                          // A failure mid-body closes the connection; ExoPlayer then asks again from where it is.
                          chunk = fetch(stream.url, offset, end)
                      }
          """,
          """            var offset = start
                      while (true) {
                          // Start the next chunk while this one is written, so the network doesn't wait for the player.
                          val after = offset + chunk.size
                          val upcoming =
                              if (chunk.isNotEmpty() && after <= end) {
                                  prefetchPool.submit(Callable { fetch(stream.url, after, end) })
                              } else {
                                  null
                              }
                          out.write(chunk)
                          offset += chunk.size
                          if (offset > end || chunk.isEmpty()) break
                          // A failure mid-body closes the connection; ExoPlayer then asks again from where it is.
                          chunk =
                              try {
                                  upcoming!!.get()
                              } catch (e: ExecutionException) {
                                  throw (e.cause as? IOException) ?: IOException(e.cause)
                              }
                      }
          """)
          print("Proxy-ul descarca urmatoarea bucata in paralel")
          PY

