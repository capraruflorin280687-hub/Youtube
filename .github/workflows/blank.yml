name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Find the Flutter project
        run: |
          pubspec=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [[ -z "$pubspec" ]]; then
            echo "::error::pubspec.yaml not found in the repository. The project files were not uploaded."
            exit 1
          fi
          dir=$(dirname "$pubspec")
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          echo "Project folder: $dir"
          if [[ ! -d "$dir/android" ]]; then
            echo "::error::The android/ folder is missing in $dir. Upload the whole project, including android/."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --split-per-abi --build-number="${{ github.run_number }}"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/YouPipe-Music-$abi.apk"
          done

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: YouPipe-Music-apks
          path: ${{ env.PROJECT_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish the APKs on GitHub
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Most phones need arm64-v8a."
