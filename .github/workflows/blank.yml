name: Build YouTube Immersive

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool
        run: curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Decompile
        run: java -jar apktool.jar d -f -o app YouTube_21_13_164.apk

      - name: Patch themes (fullscreen + cutout)
        run: |
          python3 - <<'EOF'
          import re
          man = open('app/AndroidManifest.xml', encoding='utf8').read()
          themes = set(re.findall(r'android:theme="@style/([^"]+)"', man))
          print("Themes found:", themes)
          p = 'app/res/values/styles.xml'
          s = open(p, encoding='utf8').read()
          add = ('<item name="android:windowFullscreen">true</item>'
                 '<item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>')
          total = 0
          for t in themes:
              pat = re.compile(r'(<style name="' + re.escape(t) + r'"[^>]*>)(.*?)(</style>)', re.S)
              def f(m):
                  body = re.sub(r'\s*<item name="android:(windowFullscreen|windowLayoutInDisplayCutoutMode)">.*?</item>', '', m.group(2))
                  return m.group(1) + body + add + m.group(3)
              s, c = pat.subn(f, s)
              total += c
          print("Styles patched:", total)
          if total == 0:
              raise SystemExit("No theme patched")
          open(p, 'w', encoding='utf8').write(s)
          EOF

      - name: Rebuild
        run: java -jar apktool.jar b --use-aapt2 -o unsigned.apk app

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore my.keystore -alias key -keyalg RSA -keysize 2048 \
