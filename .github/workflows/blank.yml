      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - run: flutter pub get
      - name: Buffer ExoPlayer mai mare si wake lock
        run: |
          python3 - <<'PY'
          import glob, os

          base = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          files = glob.glob(base + '/video_player_android-*/android/src/main/java/**/*.java', recursive=True)
          patched = 0
          for f in files:
              s = open(f, encoding='utf-8').read()
              if 'ExoPlayer.Builder(' not in s or 'setLoadControl' in s:
                  continue
              media3 = 'androidx.media3' in s
              pkg = 'androidx.media3.exoplayer' if media3 else 'com.google.android.exoplayer2'
              cpkg = 'androidx.media3.common' if media3 else 'com.google.android.exoplayer2'
              i = s.index('ExoPlayer.Builder(')
              j = i + len('ExoPlayer.Builder(')
              depth = 1
              while depth:
                  c = s[j]
                  depth += (c == '(')
                  depth -= (c == ')')
                  j += 1
              lc = (".setLoadControl(new " + pkg + ".DefaultLoadControl.Builder()"
                    ".setBufferDurationsMs(30000, 90000, 1000, 2500)"
                    ".setPrioritizeTimeOverSizeThresholds(true).build())"
                    # Tine procesorul si Wi-Fi-ul active cu ecranul stins, ca redarea sa nu se opreasca in fundal
                    ".setWakeMode(" + cpkg + ".C.WAKE_MODE_NETWORK)")
              s = s[:j] + lc + s[j:]
              open(f, 'w', encoding='utf-8').write(s)
              patched += 1
              print('Buffer marit + wake lock in', f)
          if not patched:
              print('ATENTIE: nu am gasit ExoPlayer.Builder in video_player_android; bufferul ramane implicit')
          else:
              print('Buffer ExoPlayer: porneste dupa 1 s, tine pana la 90 s in avans; Wi-Fi/CPU active cu ecranul stins')
          PY

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: youpipe-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
