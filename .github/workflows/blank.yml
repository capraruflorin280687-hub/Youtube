name: Build YouPipe personalizat

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca codul sursa YouPipe
        uses: actions/checkout@v4
        with:
          repository: SanuSanal/YouPipe

      - name: Sterge textul YouPipe din antet
        run: |
          python3 - <<'PY'
          import re
          p = 'lib/ui/widgets/common.dart'
          s = open(p).read()
          new = re.sub(
              r"\n\s*const SizedBox\(width: 1\),\n\s*Text\(\n\s*'YouPipe',.*?height: 1,\n\s*\),\n\s*\),",
              "", s, count=1, flags=re.S)
          assert new != s, "Nu am gasit textul din antet"
          open(p, 'w').write(new)
          PY

      - name: Fundal negru OLED (FF000000)
        run: |
          sed -i 's/background: Color(0xFF0F0F0F)/background: Color(0xFF000000)/; s/navBar: Color(0xFF0F0F0F)/navBar: Color(0xFF000000)/' lib/ui/theme/yt_theme.dart
          grep -q "background: Color(0xFF000000)" lib/ui/theme/yt_theme.dart || { echo "Nu am gasit culoarea de fundal"; exit 1; }
          sed -i 's/#0F0F0F/#000000/' android/app/src/main/res/values-night-v31/styles.xml || true

      - name: Scoate toate Shorts (bara de jos si din aplicatie)
        run: |
          python3 - <<'PY'
          import re, sys

          def patch(path, old, new, count=1):
              s = open(path).read()
              assert s.count(old) >= 1, f"Nu am gasit in {path}: {old[:60]}"
              s = s.replace(old, new) if count == 0 else s.replace(old, new, count)
              open(path, 'w').write(s)

          p = 'lib/ui/shell/app_shell.dart'
          s = open(p).read()
          old = 'for (var i = 0; i < _navLabels.length; i++)'
          assert s.count(old) == 2, "Bucle de navigare neasteptate"
          s = s.replace(old, old + '\n                if (i != 1)')
          open(p, 'w').write(s)

          p = 'lib/innertube/parsers.dart'
          patch(p, 'YtItem? _shortsLockup(Json v) {\n', 'YtItem? _shortsLockup(Json v) {\n  return null;\n')
          patch(p, 'YtItem? _reelItem(Json v) {\n', 'YtItem? _reelItem(Json v) {\n  return null;\n')
          patch(p, "if (nav<Json>(f, ['searchFilterRenderer']) case final r?)",
                   "if (nav<Json>(f, ['searchFilterRenderer']) case final r? when textOf(r['label']) != 'Shorts')")

          patch('lib/features/home/home_screen.dart',
                "final shorts = ref.watch(homeShortsProvider).value ?? const <VideoItem>[];",
                "final shorts = const <VideoItem>[];")

          p = 'lib/features/subscriptions/subscriptions_screen.dart'
          patch(p, "final shorts = _filter == _Filter.all ? filtered.where((v) => v.isShort).take(12).toList() : const <VideoItem>[];",
                   "final shorts = const <VideoItem>[];")
          patch(p, "for (final f in _Filter.values)", "for (final f in _Filter.values.where((x) => x != _Filter.shorts))")

          patch('lib/features/channel/channel_screen.dart',
                "{'Home', 'Videos', 'Shorts', 'Live',", "{'Home', 'Videos', 'Live',")
          print("Shorts eliminate")
          PY

      - name: Scoate bara All / Music / Gaming din Home
        run: |
          python3 - <<'PY'
          import re
          p = 'lib/features/home/home_screen.dart'
          s = open(p).read()
          new = re.sub(
              r"YtTopBar\(\n\s*bottom: PreferredSize\(.*?select\(c\),\n\s*\),\n\s*\],\n\s*\),\n\s*\),\n\s*\),",
              "const YtTopBar(),", s, count=1, flags=re.S)
          assert new != s, "Nu am gasit bara de chip-uri din Home"
          open(p, 'w').write(new)
          print("Bara de chip-uri eliminata")
          PY

      - name: Scoate sectiunea de comentarii
        run: |
          python3 - <<'PY'
          import re
          p = 'lib/features/watch/watch_details.dart'
          s = open(p).read()
          new = re.sub(
              r"\n\s*SliverToBoxAdapter\(\n\s*child: _CommentsTeaser\(videoId: video\.id, onTap: \(\) => onSheet\(WatchSheet\.comments\)\),\n\s*\),",
              "", s, count=1)
          assert new != s, "Nu am gasit sectiunea de comentarii"
          open(p, 'w').write(new)
          print("Comentarii eliminate")
          PY

      - name: Traducere in romana si Romania ca locatie implicita
        run: |
          python3 - <<'PY'
          import re

          FILES = """lib/features/settings/settings_screen.dart lib/features/account/account.dart lib/features/you/you_screen.dart
          lib/ui/widgets/video_menu.dart lib/features/playlist/playlist_screen.dart lib/features/watch/player_settings.dart
          lib/features/watch/watch_details.dart lib/features/search/search_screen.dart lib/features/update/update_sheet.dart
          lib/features/update/update.dart lib/features/update/updater.dart lib/features/downloads/downloads.dart
          lib/features/sponsorblock/sponsorblock.dart lib/features/home/home_screen.dart
          lib/features/subscriptions/subscriptions_screen.dart lib/features/subscriptions/import_export.dart
          lib/ui/shell/app_shell.dart lib/features/cast/cast_feature.dart lib/features/watch/player_view.dart
          lib/ui/widgets/video_tiles.dart lib/ui/widgets/common.dart lib/ui/widgets/top_bar.dart lib/features.dart
          lib/data/video_info.dart""".split()

          T = {
           "Settings": "Setări", "General": "General", "Appearance": "Aspect",
           "Use device theme": "Folosește tema dispozitivului", "Dark theme": "Temă întunecată", "Light theme": "Temă luminoasă",
           "Language": "Limbă", "Location": "Locație", "Picture-in-picture": "Picture-in-picture",
           "Keep watching in a small window when you leave the app": "Continuă să te uiți într-o fereastră mică când ieși din aplicație",
           "Playback": "Redare", "Resume where you left off": "Reia de unde ai rămas",
           "Video quality preferences": "Preferințe de calitate video",
           "Manage all history": "Gestionează tot istoricul", "Pause watch history": "Oprește istoricul de vizionare",
           "Pause search history": "Oprește istoricul căutărilor", "Clear watch history": "Șterge istoricul de vizionare",
           "Watch history cleared": "Istoricul de vizionare a fost șters", "Clear search history": "Șterge istoricul căutărilor",
           "Search history cleared": "Istoricul căutărilor a fost șters", "About": "Despre",
           "Open source licenses": "Licențe open source",
           "YouPipe is an independent, open-source app. It isn\\'t made by or affiliated with YouTube or Google.":
             "YouPipe este o aplicație independentă, open source. Nu este creată de YouTube sau Google și nu are legătură cu acestea.",
           "United States": "Statele Unite", "United Kingdom": "Regatul Unit", "Ireland": "Irlanda", "India": "India",
           "Canada": "Canada", "Australia": "Australia", "Germany": "Germania", "France": "Franța", "Spain": "Spania",
           "Brazil": "Brazilia", "Japan": "Japonia", "South Korea": "Coreea de Sud", "United Arab Emirates": "Emiratele Arabe Unite",
           "Updates": "Actualizări", "Check for updates automatically": "Verifică automat actualizările",
           "Looks for a new release on GitHub when the app opens": "Caută o versiune nouă pe GitHub când se deschide aplicația",
           "Check for updates": "Verifică actualizările", "Couldn't check for updates": "Nu s-au putut verifica actualizările",
           "Update available": "Actualizare disponibilă", "Update": "Actualizează", "Later": "Mai târziu",
           "Skip this version": "Sari peste această versiune", "Full release notes": "Notele complete ale versiunii",
           "Open GitHub": "Deschide GitHub", "Try again": "Încearcă din nou",
           "Cancel": "Anulează", "Delete": "Șterge", "Remove": "Elimină", "Save": "Salvează", "Retry": "Reîncearcă",
           "Rename": "Redenumește", "Share": "Distribuie", "Download": "Descarcă", "Close": "Închide",
           "Search": "Caută", "View all": "Vezi tot", "Undo": "Anulează", "Accept": "Acceptă", "Off": "Oprit",
           "Show": "Afișează", "Skip": "Sari peste", "Expand": "Extinde", "Pause": "Pauză", "Play": "Redare",
           "Previous": "Anterior", "Next": "Următorul", "Like": "Îmi place", "Dislike": "Nu îmi place",
           "Comments": "Comentarii", "Subscribe": "Abonează-te", "Subscribed": "Abonat", "Unsubscribe": "Dezabonează-te",
           "Watch later": "Vizionează mai târziu",
           "Search YouPipe": "Caută în YouPipe",
           "No connection": "Fără conexiune", "Something went wrong": "Ceva nu a funcționat",
           "Check your internet connection and try again.": "Verifică conexiunea la internet și încearcă din nou.",
           "Signed in": "Autentificat", "Sign in": "Autentifică-te", "Sign in (optional)": "Autentifică-te (opțional)",
           "You": "Tu", "Sign out": "Deconectează-te",
           "Cast": "Proiectează", "Select a device": "Alege un dispozitiv", "Connected": "Conectat",
           "Downloads": "Descărcări", "Full HD": "Full HD", "High": "Mare", "Medium": "Medie", "Low": "Mică",
           "Quality": "Calitate", "Playback speed": "Viteza de redare", "Normal": "Normală",
           "Captions": "Subtitrări", "Loop video": "Repetă videoclipul", "Sleep timer": "Temporizator de oprire",
           "Auto": "Automat", "History": "Istoric", "Playlists": "Liste de redare",
           "Description": "Descriere", "Likes": "Aprecieri", "Views": "Vizionări", "Chapters": "Capitole",
           "January": "ianuarie", "February": "februarie", "March": "martie", "April": "aprilie", "May": "mai", "June": "iunie",
           "July": "iulie", "August": "august", "September": "septembrie", "October": "octombrie", "November": "noiembrie", "December": "decembrie",
           "Today": "Astăzi", "Yesterday": "Ieri", "This week": "Săptămâna aceasta",
           "Sponsor": "Sponsor", "Paid promotion": "Promovare plătită",
           "No views": "Fără vizionări", "Just now": "Chiar acum",
          }

          p = 'lib/ui/shell/app_shell.dart'
          s = open(p, encoding='utf-8').read()
          old = "const _navLabels = ['Home', 'Shorts', 'Subscriptions', 'You'];"
          if old in s:
              s = s.replace(old, "const _navLabels = ['Acasă', 'Shorts', 'Abonamente', 'Tu'];")
              open(p, 'w', encoding='utf-8').write(s)

          total = 0
          for f in FILES:
              try:
                  s = open(f, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              orig = s
              for en, ro in T.items():
                  for q in ("'", '"'):
                      a, b = q + en + q, q + ro + q
                      if a in s:
                          s = s.replace(a, b); total += 1
              if s != orig:
                  open(f, 'w', encoding='utf-8').write(s)

          p = 'lib/features/settings/settings_screen.dart'
          s = open(p, encoding='utf-8').read()
          if "  'en': 'English',\n" in s and "  'ro': 'Română',\n" not in s:
              s = s.replace("  'en': 'English',\n", "  'en': 'English',\n  'ro': 'Română',\n", 1)
          if "  'US': 'Statele Unite',\n" in s and "  'RO': 'România',\n" not in s:
              s = s.replace("  'US': 'Statele Unite',\n", "  'RO': 'România',\n  'US': 'Statele Unite',\n", 1)
          open(p, 'w', encoding='utf-8').write(s)

          p = 'lib/providers.dart'
          s = open(p, encoding='utf-8').read()
          old = "gl: p.getString('gl') ?? 'US',"
          if old in s:
              s = s.replace(old, "gl: p.getString('gl') ?? 'RO',")
              open(p, 'w', encoding='utf-8').write(s)
          print(f"Traduceri aplicate: {total}; Romania setata ca locatie implicita")
          PY

      - name: Bara de navigare ascunsa (apare la derulare) si mod imersiv
        run: |
          python3 - <<'PY'
          p = 'lib/ui/shell/app_shell.dart'
          s = open(p, encoding='utf-8').read()

          def rep(old, new):
              global s
              assert s.count(old) == 1, f"Potrivire neasteptata ({s.count(old)}): {old[:70]}"
              s = s.replace(old, new)

          if "package:flutter/rendering.dart" not in s:
              rep("import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter/rendering.dart' show ScrollDirection;\n")

          if "_navHide" not in s:
              rep("  late final _side = AnimationController(vsync: this, value: 1, duration: const Duration(milliseconds: 250));\n",
                  "  late final _side = AnimationController(vsync: this, value: 1, duration: const Duration(milliseconds: 250));\n\n"
                  "  late final _navHide = AnimationController(vsync: this, value: 1, duration: const Duration(milliseconds: 200));\n")
              rep("    _side.dispose();\n", "    _side.dispose();\n    _navHide.dispose();\n")
              rep("Listenable.merge([_panel, _dismiss, _side])", "Listenable.merge([_panel, _dismiss, _side, _navHide])")
              rep("                          final t = playing == null ? 0.0 : _panel.value;\n",
                  "                          final t = playing == null ? 0.0 : _panel.value;\n"
                  "                          final navGap = navHeight * (1 - _navHide.value) + (wide ? 0.0 : media.padding.bottom * _navHide.value);\n")
              rep("final miniTop = size.height - navHeight - miniH - m;", "final miniTop = size.height - navGap - miniH - m;")
              rep("                                left: railW,\n                                bottom: navHeight,\n",
                  "                                left: railW,\n                                bottom: navGap,\n")
              rep("bottom: -navHeight * t,", "bottom: -navHeight * math.max(t, _navHide.value),")
              rep("                                      child: widget.navigationShell,\n",
                  "                                      child: NotificationListener<UserScrollNotification>(\n"
                  "                                        onNotification: _onUserScroll,\n"
                  "                                        child: widget.navigationShell,\n"
                  "                                      ),\n")
              rep("  void _openTab(int i) {\n",
                  "  bool _onUserScroll(UserScrollNotification n) {\n"
                  "    if (n.metrics.axis != Axis.vertical) return false;\n"
                  "    if (n.direction == ScrollDirection.reverse) {\n"
                  "      _navHide.forward();\n"
                  "    } else if (n.direction == ScrollDirection.forward) {\n"
                  "      _navHide.reverse();\n"
                  "    }\n"
                  "    return false;\n"
                  "  }\n\n"
                  "  void _openTab(int i) {\n    _navHide.reverse();\n")

          open(p, 'w', encoding='utf-8').write(s)

          for path in ['lib/main.dart', p]:
              try:
                  t = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              t = t.replace("SystemUiMode.edgeToEdge", "SystemUiMode.immersiveSticky")
              open(path, 'w', encoding='utf-8').write(t)
          print("Bara de navigare ascunsa implicit + mod imersiv")
          PY

      - name: Elimina bara neagra de sus (imersiv complet)
        run: |
          python3 - <<'PY'
          p = 'lib/main.dart'
          s = open(p, encoding='utf-8').read()
          old = "Offstage(offstage: pip, child: child),"
          if old in s:
              new = """Offstage(
                        offstage: pip,
                        child: MediaQuery(
                          data: MediaQuery.of(context).copyWith(
                            padding: MediaQuery.of(context).padding.copyWith(top: 0),
                            viewPadding: MediaQuery.of(context).viewPadding.copyWith(top: 0),
                          ),
                          child: child ?? const SizedBox.shrink(),
                        ),
                      ),"""
              s = s.replace(old, new)
              open(p, 'w', encoding='utf-8').write(s)
              print("Spatiul rezervat sus a fost eliminat")
          else:
              print("Nu am gasit builder-ul din main.dart (sar peste)")
          PY

      - name: Bara de jos cu efect mat (frosted glass)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          p = 'lib/ui/shell/app_shell.dart'
          s = open(p, encoding='utf-8').read()

          if "dart:ui" not in s:
              s = s.replace(
                  "import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\nimport 'dart:ui' show ImageFilter;",
                  1,
              )

          s = s.replace(
              "color: c.navBar.withValues(alpha: 0.4),",
              "color: c.navBar.withValues(alpha: 0.35),",
          )
          if "color: c.navBar.withValues(alpha: 0.35)," not in s:
              s = s.replace(
                  "color: c.navBar,",
                  "color: c.navBar.withValues(alpha: 0.35),",
              )

          if "class _Frosted" not in s:
              s = s.rstrip() + '''

          /// Efect mat (frosted glass) — blur peste continutul din spate.
          class _Frosted extends StatelessWidget {
            const _Frosted({required this.child, this.sigma = 18});
            final Widget child;
            final double sigma;

            @override
            Widget build(BuildContext context) {
              return ClipRect(
                child: BackdropFilter(
                  filter: ImageFilter.blur(sigmaX: sigma, sigmaY: sigma),
                  child: child,
                ),
              );
            }
          }
          '''
          open(p, 'w', encoding='utf-8').write(s)
          print("Clasa _Frosted adaugata")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ⬇️ AICI e cheia: channel master pentru Dart 3.13+
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - run: flutter pub get

      - name: Buffer ExoPlayer mai mare
        run: |
          python3 - <<'PY'
          import glob, os

          base = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          files = glob.glob(base + '/video_player_android-*/android/src/main/java/**/*.java', recursive=True)
          patched = 0
          for f in files:
              s = open(f, encoding='utf-8').read()
              if 'ExoPlayer.Builder(' not in s or 'setLoadControl' in s:
                  continue
              pkg = 'androidx.media3.exoplayer' if 'androidx.media3' in s else 'com.google.android.exoplayer2'
              i = s.index('ExoPlayer.Builder(')
              j = i + len('ExoPlayer.Builder(')
              depth = 1
              while depth:
                  c = s[j]
                  depth += (c == '(')
                  depth -= (c == ')')
                  j += 1
              lc = (".setLoadControl(new " + pkg + ".DefaultLoadControl.Builder()"
                    ".setBufferDurationsMs(30000, 90000, 1000, 2500)"
                    ".setPrioritizeTimeOverSizeThresholds(true).build())")
              s = s[:j] + lc + s[j:]
              open(f, 'w', encoding='utf-8').write(s)
              patched += 1
              print('Buffer marit in', f)
          if not patched:
              print('ATENTIE: nu am gasit ExoPlayer.Builder in video_player_android')
          else:
              print('Buffer ExoPlayer: porneste dupa 1 s, tine pana la 90 s in avans')
          PY

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: youpipe-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
