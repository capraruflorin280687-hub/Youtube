          k = 'android/app/src/main/kotlin/com/youpipe/app/DownloadWorker.kt'
          patch(k, "            Result.success(workDataOf(KEY_PATH to out.path, KEY_SIZE to out.length(), KEY_HEIGHT to height))\n",
                   "            exportToDevice(out, maxHeight == 0)\n"
                   "            Result.success(workDataOf(KEY_PATH to out.path, KEY_SIZE to out.length(), KEY_HEIGHT to height))\n")
          patch(k, "    private var lastProgress = 0L\n", r'''    /** Also saves a copy in the shared Music / Movies folder (Android 10+), so it shows up in other apps and file managers. */
              private fun exportToDevice(
                  file: File,
                  audio: Boolean,
              ) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return
                  try {
                      val safe = title.replace(Regex("[^\\p{L}\\p{N} ._-]"), "_").trim().ifEmpty { videoId }.take(100)
                      val values =
                          android.content.ContentValues().apply {
                              put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, safe + if (audio) ".m4a" else ".mp4")
                              put(android.provider.MediaStore.MediaColumns.MIME_TYPE, if (audio) "audio/mp4" else "video/mp4")
                              put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, if (audio) "Music/YouPipe" else "Movies/YouPipe")
                              put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                      val collection =
                          if (audio) {
                              android.provider.MediaStore.Audio.Media.getContentUri(android.provider.MediaStore.VOLUME_EXTERNAL_PRIMARY)
                          } else {
                              android.provider.MediaStore.Video.Media.getContentUri(android.provider.MediaStore.VOLUME_EXTERNAL_PRIMARY)
                          }
                      val resolver = applicationContext.contentResolver
                      val uri = resolver.insert(collection, values) ?: return
                      resolver.openOutputStream(uri)?.use { output -> file.inputStream().use { it.copyTo(output) } }
                      values.clear()
                      values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0)
                      resolver.update(uri, values, null, null)
                  } catch (e: Throwable) {
                      Log.w("YouPipe", "export to device failed", e)
                  }
              }

              private var lastProgress = 0L
          ''')

