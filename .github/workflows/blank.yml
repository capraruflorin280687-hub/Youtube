              'day': 'zile',
              'week': 'săptămâni',
              'month': 'luni',
              'year': 'ani',
            };
            if (n == 1) return 'acum ${one[unit]}';
            final de = (n % 100 == 0 || n % 100 >= 20) ? ' de' : '';
            return 'acum $n$de ${many[unit]}';
          }
