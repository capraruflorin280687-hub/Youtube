name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the universal APK as the 'v-debug' pre-release"
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 21.0.6113669
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Build the debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug

      - name: Collect the APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp smarttubetv/build/outputs/renamed_apks/stmobileDebug/NewTube_*.apk dist/
          ls -lh dist
          universal="$(ls dist/NewTube_*_universal.apk | head -n 1)"
          echo "UNIVERSAL_APK=$universal" >> "$GITHUB_ENV"

      - name: Upload the APKs as a workflow artifact
        us
