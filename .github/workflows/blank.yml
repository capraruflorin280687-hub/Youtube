name: Build NewTube APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [ debug, release ]
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (optional)
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/key.jks"
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew :smarttubetv:assembleStmob
