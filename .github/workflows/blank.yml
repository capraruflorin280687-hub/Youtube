name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Genereaza proiectul
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YouTubeWrapper"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ytwrapper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ytwrapper"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="YT Wrapper"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="www.youtube.com" />
                          <data android:scheme="https" android:host="m.youtube.com" />
                          <data android:scheme="https" android:host="youtu.be" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/ytwrapper
          cat > app/src/main/java/com/example/ytwrapper/MainActivity.kt <<'EOF_FILE'
          package com.example.ytwrapper

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.PictureInPictureParams
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import java.io.ByteArrayInputStream

          class BgWebView(context: Context) : WebView(context) {
              override fun onWindowVisibilityChanged(visibility: Int) {
                  // Ignorăm "ascuns", ca să nu se oprească redarea în fundal
                  if (visibility != View.GONE) super.onWindowVisibilityChanged(visibility)
              }
          }

          class MainActivity : AppCompatActivity() {

              private lateinit var root: FrameLayout
              private lateinit var webView: WebView
              private var customView: View? = null
              private var customCallback: WebChromeClient.CustomViewCallback? = null

              private val allowedHosts = listOf(
                  "youtube.com", "youtu.be", "google.com", "gstatic.com",
                  "googlevideo.com", "ytimg.com", "googleusercontent.com"
              )

              // Cereri blocate (rețele de reclame)
              private val blockedPatterns = listOf(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "/pagead/", "/api/stats/ads", "/ptracking", "adservice.google"
              )

              // Script injectat în pagină: ascunde reclamele și sare peste cele video
              private val adBlockJs = """
                  (function(){
                    if (window.__ytab) return; window.__ytab = true;
                    var css = document.createElement('style');
                    css.textContent = 'ytm-promoted-sparkles-web-renderer,ytm-promoted-video-renderer,'
                      + 'ytm-companion-slot,ytd-ad-slot-renderer,ytm-ad-slot-renderer,ad-slot-renderer,'
                      + '.ytp-ad-overlay-container,.ytp-ad-module,.ad-container,#player-ads,'
                      + 'ytm-statement-banner-renderer,ytm-brand-video-singleton-renderer,'
                      + 'ytm-mealbar-promo-renderer{display:none!important}';
                    document.documentElement.appendChild(css);
                    function skip(){
                      var p = document.querySelector('.html5-video-player');
                      var v = document.querySelector('video');
                      if (!v) return;
                      if (p && p.classList.contains('ad-showing')) {
                        if (!v.muted) { v.muted = true; window.__ytabMuted = true; }
                        if (isFinite(v.duration) && v.duration > 0) { v.currentTime = v.duration; }
                        var b = document.querySelector('.ytp-ad-skip-button,.ytp-ad-skip-button-modern,'
                          + '.ytp-skip-ad-button,.ytp-ad-skip-button-container button');
                        if (b) b.click();
                      } else if (window.__ytabMuted) {
                        v.muted = false; window.__ytabMuted = false;
                      }
                    }
                    setInterval(skip, 300);
                  })();
              """.trimIndent()

              // Păcălește pagina să creadă că e mereu vizibilă, ca să nu oprească redarea în fundal
              private val visibilityJs = """
                  (function(){
                    if (window.__ytvis) return; window.__ytvis = true;
                    try {
                      Object.defineProperty(document, 'hidden',
                        {configurable: true, get: function(){ return false; }});
                      Object.defineProperty(document, 'visibilityState',
                        {configurable: true, get: function(){ return 'visible'; }});
                    } catch (e) {}
                    document.addEventListener('visibilitychange',
                      function(e){ e.stopImmediatePropagation(); }, true);
                    window.addEventListener('blur',
                      function(e){ e.stopImmediatePropagation(); }, true);
                  })();
              """.trimIndent()

              // În modul PiP, video-ul umple fereastra mică
              private val pipOnJs = """
                  (function(){
                    if (document.getElementById('__ytpip')) return;
                    var s = document.createElement('style'); s.id = '__ytpip';
                    s.textContent = 'video{position:fixed!important;top:0!important;left:0!important;'
                      + 'width:100vw!important;height:100vh!important;z-index:2147483647!important;'
                      + 'background:#000!important;object-fit:contain!important}'
                      + 'body{overflow:hidden!important}';
                    document.documentElement.appendChild(s);
                  })();
              """.trimIndent()

              private val pipOffJs =
                  "(function(){var s=document.getElementById('__ytpip'); if(s) s.remove();})();"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  webView = BgWebView(this)
                  root.addView(
                      webView,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  setContentView(root)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      cacheMode = WebSettings.LOAD_DEFAULT
                      // Fără "wv" în user agent, ca să nu fie tratat ca WebView embedded
                      userAgentString = userAgentString.replace("; wv", "")
                  }

                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(webView, true)
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView, request: WebResourceRequest
                      ): WebResourceResponse? {
                          val url = request.url.toString()
                          if (blockedPatterns.any { url.contains(it) }) {
                              return WebResourceResponse(
                                  "text/plain", "utf-8", ByteArrayInputStream(ByteArray(0))
                              )
                          }
                          return super.shouldInterceptRequest(view, request)
                      }

                      override fun doUpdateVisitedHistory(view: WebView, url: String?, isReload: Boolean) {
                          super.doUpdateVisitedHistory(view, url, isReload)
                          updatePipParams(url)
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: android.graphics.Bitmap?) {
                          super.onPageStarted(view, url, favicon)
                          view.evaluateJavascript(visibilityJs, null)
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          super.onPageFinished(view, url)
                          view.evaluateJavascript(visibilityJs, null)
                          view.evaluateJavascript(adBlockJs, null)
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView, request: WebResourceRequest
                      ): Boolean {
                          val host = request.url.host ?: return false
                          val internal = allowedHosts.any { host == it || host.endsWith(".$it") }
                          if (internal) return false
                          startActivity(Intent(Intent.ACTION_VIEW, request.url))
                          return true
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View, callback: CustomViewCallback) {
                          if (customView != null) {
                              callback.onCustomViewHidden()
                              return
                          }
                          customView = view
                          customCallback = callback
                          webView.visibility = View.GONE
                          root.addView(view)
                          setFullscreenMode(true)
                      }

                      override fun onHideCustomView() {
                          customView?.let { root.removeView(it) }
                          customView = null
                          customCallback?.onCustomViewHidden()
                          customCallback = null
                          webView.visibility = View.VISIBLE
                          setFullscreenMode(false)
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          when {
                              customView != null -> webView.webChromeClient?.onHideCustomView()
                              webView.canGoBack() -> webView.goBack()
                              else -> finish()
                          }
                      }
                  })

                  // Permisiune notificări (Android 13+) + serviciu pentru redare în fundal
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(
                          this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1
                      )
                  }
                  ContextCompat.startForegroundService(this, Intent(this, KeepAliveService::class.java))

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState)
                  } else {
                      webView.loadUrl(intent?.data?.toString() ?: "https://m.youtube.com")
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  intent.data?.let { webView.loadUrl(it.toString()) }
              }

              private fun pipParams(autoEnter: Boolean): PictureInPictureParams {
                  val b = PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9))
                  if (Build.VERSION.SDK_INT >= 31) b.setAutoEnterEnabled(autoEnter)
                  return b.build()
              }

              // Pe Android 12+, PiP pornește automat când ieși din aplicație în timpul unui video
              private fun updatePipParams(url: String?) {
                  if (Build.VERSION.SDK_INT >= 31) {
                      try {
                          setPictureInPictureParams(pipParams(url?.contains("/watch") == true))
                      } catch (_: Exception) {
                      }
                  }
              }

              // Când apeși Home în timp ce se redă un video, intră în Picture-in-Picture
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= 26 &&
                      webView.url?.contains("/watch") == true &&
                      !isInPictureInPictureMode
                  ) {
                      try {
                          if (!enterPictureInPictureMode(pipParams(true))) {
                              Toast.makeText(
                                  this,
                                  "PiP blocat: activeaz\u0103 Picture-in-picture pentru aplica\u021bie \u00een Set\u0103ri",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      } catch (e: Exception) {
                          Toast.makeText(this, "PiP indisponibil: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              override fun onPictureInPictureModeChanged(
                  isInPictureInPictureMode: Boolean, newConfig: Configuration
              ) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  webView.evaluateJavascript(if (isInPictureInPictureMode) pipOnJs else pipOffJs, null)
              }

              private fun setFullscreenMode(enable: Boolean) {
                  WindowCompat.setDecorFitsSystemWindows(window, !enable)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  if (enable) {
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  } else {
                      controller.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onPause() {
                  super.onPause()
                  // Reținem dacă video-ul rula, ca să îl putem relua dacă pagina îl oprește în fundal
                  webView.evaluateJavascript(
                      "(function(){var v=document.querySelector('video');" +
                          "window.__ytWasPlaying=!!(v&&!v.paused&&!v.ended);})();", null
                  )
                  CookieManager.getInstance().flush()
              }

              override fun onStop() {
                  super.onStop()
                  webView.resumeTimers()
                  val resume = "(function(){var v=document.querySelector('video');" +
                      "if(v&&window.__ytWasPlaying&&v.paused){v.play();}})();"
                  webView.postDelayed({ webView.evaluateJavascript(resume, null) }, 400)
                  webView.postDelayed({ webView.evaluateJavascript(resume, null) }, 1500)
              }

              override fun onDestroy() {
                  stopService(Intent(this, KeepAliveService::class.java))
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/ytwrapper
          cat > app/src/main/java/com/example/ytwrapper/KeepAliveService.kt <<'EOF_FILE'
          package com.example.ytwrapper

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat

          // Serviciu în prim-plan: ține aplicația activă când ecranul e stins sau aplicația e în fundal
          class KeepAliveService : Service() {

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "yt_playback"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(channelId, "Redare YouTube", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("YT Wrapper")
                      .setContentText("Redare activă în fundal")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
                  ServiceCompat.startForeground(
                      this, 1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
                  )
                  return START_NOT_STICKY
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  stopSelf()
                  super.onTaskRemoved(rootIntent)
              }
          }
          EOF_FILE
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yt-wrapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
