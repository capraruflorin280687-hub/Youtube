name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Genereaza proiectul
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YouTubeWrapper"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ytwrapper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ytwrapper"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="YT Wrapper"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- Deschide linkurile YouTube direct în aplicație -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="www.youtube.com" />
                          <data android:scheme="https" android:host="m.youtube.com" />
                          <data android:scheme="https" android:host="youtu.be" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/ytwrapper
          cat > app/src/main/java/com/example/ytwrapper/MainActivity.kt <<'EOF_FILE'
          package com.example.ytwrapper

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import java.io.ByteArrayInputStream
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var root: FrameLayout
              private lateinit var webView: WebView
              private var customView: View? = null
              private var customCallback: WebChromeClient.CustomViewCallback? = null

              private val allowedHosts = listOf(
                  "youtube.com", "youtu.be", "google.com", "gstatic.com",
                  "googlevideo.com", "ytimg.com", "googleusercontent.com"
              )

              // Cereri blocate (rețele de reclame)
              private val blockedPatterns = listOf(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "/pagead/", "/api/stats/ads", "/ptracking", "adservice.google"
              )

              // Script injectat în pagină: ascunde reclamele și sare peste cele video
              private val adBlockJs = """
                  (function(){
                    if (window.__ytab) return; window.__ytab = true;
                    var css = document.createElement('style');
                    css.textContent = 'ytm-promoted-sparkles-web-renderer,ytm-promoted-video-renderer,'
                      + 'ytm-companion-slot,ytd-ad-slot-renderer,ytm-ad-slot-renderer,ad-slot-renderer,'
                      + '.ytp-ad-overlay-container,.ytp-ad-module,.ad-container,#player-ads,'
                      + 'ytm-statement-banner-renderer,ytm-brand-video-singleton-renderer,'
                      + 'ytm-mealbar-promo-renderer{display:none!important}';
                    document.documentElement.appendChild(css);
                    function skip(){
                      var p = document.querySelector('.html5-video-player');
                      var v = document.querySelector('video');
                      if (!v) return;
                      if (p && p.classList.contains('ad-showing')) {
                        if (!v.muted) { v.muted = true; window.__ytabMuted = true; }
                        if (isFinite(v.duration) && v.duration > 0) { v.currentTime = v.duration; }
                        var b = document.querySelector('.ytp-ad-skip-button,.ytp-ad-skip-button-modern,'
                          + '.ytp-skip-ad-button,.ytp-ad-skip-button-container button');
                        if (b) b.click();
                      } else if (window.__ytabMuted) {
                        v.muted = false; window.__ytabMuted = false;
                      }
                    }
                    setInterval(skip, 300);
                  })();
              """.trimIndent()

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  webView = WebView(this)
                  root.addView(
                      webView,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  setContentView(root)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      cacheMode = WebSettings.LOAD_DEFAULT
                      // Fără "wv" în user agent, ca să nu fie tratat ca WebView embedded
                      userAgentString = userAgentString.replace("; wv", "")
                  }

                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(webView, true)
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView, request: WebResourceRequest
                      ): WebResourceResponse? {
                          val url = request.url.toString()
                          if (blockedPatterns.any { url.contains(it) }) {
                              return WebResourceResponse(
                                  "text/plain", "utf-8", ByteArrayInputStream(ByteArray(0))
                              )
                          }
                          return super.shouldInterceptRequest(view, request)
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          super.onPageFinished(view, url)
                          view.evaluateJavascript(adBlockJs, null)
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView, request: WebResourceRequest
                      ): Boolean {
                          val host = request.url.host ?: return false
                          val internal = allowedHosts.any { host == it || host.endsWith(".$it") }
                          if (internal) return false
                          startActivity(Intent(Intent.ACTION_VIEW, request.url))
                          return true
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View, callback: CustomViewCallback) {
                          if (customView != null) {
                              callback.onCustomViewHidden()
                              return
                          }
                          customView = view
                          customCallback = callback
                          webView.visibility = View.GONE
                          root.addView(view)
                          setFullscreenMode(true)
                      }

                      override fun onHideCustomView() {
                          customView?.let { root.removeView(it) }
                          customView = null
                          customCallback?.onCustomViewHidden()
                          customCallback = null
                          webView.visibility = View.VISIBLE
                          setFullscreenMode(false)
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          when {
                              customView != null -> webView.webChromeClient?.onHideCustomView()
                              webView.canGoBack() -> webView.goBack()
                              else -> finish()
                          }
                      }
                  })

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState)
                  } else {
                      webView.loadUrl(intent?.data?.toString() ?: "https://m.youtube.com")
                  }
              }

              private fun setFullscreenMode(enable: Boolean) {
                  WindowCompat.setDecorFitsSystemWindows(window, !enable)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  if (enable) {
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  } else {
                      controller.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF_FILE
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yt-wrapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
