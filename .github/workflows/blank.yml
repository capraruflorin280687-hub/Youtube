name: Build YouPipe fara text
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca codul sursa YouPipe
        uses: actions/checkout@v7
        with:
          repository: SanuSanal/YouPipe

      - name: Sterge textul YouPipe din antet
        run: |
          python3 - <<'PY'
          import re
          p = 'lib/ui/widgets/common.dart'
          s = open(p).read()
          new = re.sub(
              r"\n\s*const SizedBox\(width: 1\),\n\s*Text\(\n\s*'YouPipe',.*?height: 1,\n\s*\),\n\s*\),",
              "", s, count=1, flags=re.S)
          assert new != s, "Nu am gasit textul din antet"
          open(p, 'w').write(new)
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: youpipe-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
